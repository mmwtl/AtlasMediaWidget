plugins {
    id 'com.android.application'
}

def appVersionCode = 44
def appVersionName = '2.1.4'
def branchName = providers.exec {
    commandLine('git', 'branch', '--show-current')
}.standardOutput.asText.get().trim()
def safeBranchName = { String value ->
    def sanitized = value.replaceAll(/[^A-Za-z0-9._-]+/, '-')
            .replaceAll(/^[.-]+|[.-]+$/, '')
    sanitized.isEmpty() ? 'detached' : sanitized
}
def effectiveBranchSuffix = { String branch ->
    if (branch == 'self-api' || branch == 'self') return 'self'
    return safeBranchName(branch)
}
def effectiveVersionName = branchName == 'main'
        ? appVersionName
        : "${appVersionName}-${effectiveBranchSuffix(branchName)}"
def secureSigningScript = providers.gradleProperty('secure.signing').orNull
def secureSigningFile = secureSigningScript == null ? null : rootProject.file(secureSigningScript)
def embeddedApiApk = providers.gradleProperty('embeddedApiApk')
def embeddedApiAssets = layout.buildDirectory.dir('generated/embeddedApiAssets')

def prepareEmbeddedApiApk = tasks.register('prepareEmbeddedApiApk') {
    inputs.property('embeddedApiApk', embeddedApiApk.orElse(''))
    outputs.dir(embeddedApiAssets)
    if (embeddedApiApk.isPresent()) {
        inputs.file(embeddedApiApk)
    }
    doLast {
        delete(embeddedApiAssets)
        if (!embeddedApiApk.isPresent()) {
            throw new GradleException('Bundled build requires -PembeddedApiApk=/path/to/AtlasMediaApi.apk')
        }
        copy {
            from(embeddedApiApk)
            into(embeddedApiAssets)
            rename { 'atlas-media-api.apk' }
        }
    }
}

base {
    archivesName.set("${effectiveVersionName}[${appVersionCode}]AtlasMediaWidget")
}

android {
    namespace = 'com.mmwtl.atlasmediawidget'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.mmwtl.atlasmediawidget'
        minSdk = 30
        targetSdk = 36
        versionCode = appVersionCode
        versionName = effectiveVersionName
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
    }

    flavorDimensions += 'distribution'
    productFlavors {
        plain {
            dimension 'distribution'
        }
        bundled {
            dimension 'distribution'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        bundled.assets.srcDir(embeddedApiAssets)
    }
}

androidComponents {
    beforeVariants(selector().withFlavor('distribution', 'bundled')) { variantBuilder ->
        if (!embeddedApiApk.isPresent()) variantBuilder.enable = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.configureEach { task ->
    if (task.name == 'preBundledDebugBuild' || task.name == 'preBundledReleaseBuild') {
        task.dependsOn(prepareEmbeddedApiApk)
    }
}

if (secureSigningFile != null && secureSigningFile.isFile()) {
    apply from: secureSigningFile
}
