plugins {
    id 'com.android.application'
}

def appVersionCode = 54
def appVersionName = '3.1.3'
def branchName = providers.exec {
    commandLine('git', 'branch', '--show-current')
}.standardOutput.asText.get().trim()
def safeBranchName = { String value ->
    def sanitized = value.replaceAll(/[^A-Za-z0-9._-]+/, '-')
            .replaceAll(/^[.-]+|[.-]+$/, '')
    sanitized.isEmpty() ? 'detached' : sanitized
}
def effectiveBranchSuffix = { String branch ->
    if (branch == 'self-api' || branch == 'self') return 'self'
    return safeBranchName(branch)
}
def effectiveVersionName = branchName == 'main'
        ? appVersionName
        : "${appVersionName}-${effectiveBranchSuffix(branchName)}"
def secureSigningScript = providers.gradleProperty('secure.signing').orNull
def secureSigningFile = secureSigningScript == null ? null : rootProject.file(secureSigningScript)

base {
    archivesName.set("${effectiveVersionName}[${appVersionCode}]AtlasMediaWidget")
}

android {
    namespace = 'com.mmwtl.atlasmediawidget'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.mmwtl.atlasmediawidget'
        minSdk = 30
        targetSdk = 36
        versionCode = appVersionCode
        versionName = effectiveVersionName
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
        buildConfigField 'String', 'MEDIA_BRIDGE_PACKAGE', '"com.mmwtl.atlasmediaapi"'
    }

    flavorDimensions += 'distribution'
    productFlavors {
        integrated {
            dimension 'distribution'
            buildConfigField 'String', 'MEDIA_BRIDGE_PACKAGE', '"com.mmwtl.atlasmediawidget"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        if (variant.flavorName == 'integrated') {
            def signatureSuffix = variant.signingConfig == null ? '-unsigned' : ''
            output.outputFileName = "${effectiveVersionName}[${appVersionCode}]AtlasMediaWidget-${variant.buildType.name}${signatureSuffix}.apk"
        }
    }
}

dependencies {
    integratedImplementation project(':media-runtime')
    testImplementation project(':media-core')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        setDependsOn([tasks.named('assembleIntegratedRelease')])
    }
    tasks.named('assembleDebug').configure {
        setDependsOn([tasks.named('assembleIntegratedDebug')])
    }
    tasks.register('testReleaseUnitTest') {
        dependsOn(tasks.named('testIntegratedReleaseUnitTest'))
    }
    tasks.register('testDebugUnitTest') {
        dependsOn(tasks.named('testIntegratedDebugUnitTest'))
    }
}

if (secureSigningFile != null && secureSigningFile.isFile()) {
    apply from: secureSigningFile
}
